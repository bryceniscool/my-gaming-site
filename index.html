<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UGS Files — Ultimate Game Stash</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            color: #fff;
        }
        .container { padding-top: 40px; }
        h1 { text-align: center; color: #79aadb; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #a0a0a0; margin-bottom: 40px; }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .game-card {
            background: rgba(255,255,255,0.05);
            border: 2px solid #79aadb;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(121, 170, 219, 0.4);
            background: rgba(121, 170, 219, 0.15);
        }
        .game-card h3 { font-size: 16px; margin: 10px 0; color: #fff; }
        .game-card .category { font-size: 10px; color: #79aadb; text-transform: uppercase; }
        .discord-link { text-align: center; margin-top: 40px; padding: 20px; }
        .discord-link a { color: #79aadb; text-decoration: none; font-size: 18px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 UGS Files</h1>
        <p class="subtitle">Ultimate Game Stash — Powered by JSDelivr</p>
        <div id="games-container" class="game-grid"></div>
        <div class="discord-link">
            <a href="https://discord.gg/rmVsAqkpkA" target="_blank">
                🎧 Join Discord Server
            </a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="jsdelivr-config.js"></script>
</body>
</html>
